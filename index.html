<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #02060b;
            color: #00d9ff;
            font-family: Arial, sans-serif;

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;
        }

        .title {
            position: absolute;
            top: 40px;

            font-size: 32px;
            letter-spacing: 10px;

            text-shadow:
                0 0 10px #00d9ff,
                0 0 30px #00d9ff;
        }

        .reactor {
            width: 280px;
            height: 280px;

            border-radius: 50%;

            border: 3px solid #00d9ff;

            box-shadow:
                0 0 20px #00d9ff,
                0 0 60px #008cff,
                inset 0 0 40px #00d9ff;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: pulse 2s infinite;
        }

        .core {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: #00d9ff;

            box-shadow:
                0 0 20px #00d9ff,
                0 0 60px #00d9ff,
                0 0 100px #008cff;
        }

        .status {
            margin-top: 60px;

            font-size: 20px;

            letter-spacing: 4px;

            text-shadow: 0 0 10px #00d9ff;
        }

        button {
            margin-top: 30px;

            padding: 15px 40px;

            border: 1px solid #00d9ff;

            background: transparent;

            color: #00d9ff;

            font-size: 18px;

            cursor: pointer;

            box-shadow: 0 0 15px #00d9ff;

            transition: 0.3s;
        }

        button:hover {
            background: #00d9ff;
            color: #02060b;

            box-shadow:
                0 0 30px #00d9ff,
                0 0 60px #00d9ff;
        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            J A R V I S
        </div>

        <div class="reactor">

            <div class="core"></div>

        </div>

        <div class="status" id="status">
            SYSTEM ONLINE
        </div>

        <button onclick="activateJarvis()">
            ACTIVATE
        </button>

    </div>

    <script>

        function activateJarvis() {

            const status =
                document.getElementById("status");

            status.innerText =
                "LISTENING...";

            setTimeout(function() {

                status.innerText =
                    "READY FOR COMMAND";

            }, 2000);

        }

    </script>

</body>

</html>
